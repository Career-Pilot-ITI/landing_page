<!doctype html>
<html lang="en" data-theme="cloud">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company Branding & Settings — Career Pilot Enterprise</title>
  <link rel="icon" type="image/png" href="assets/career-pilot-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
    }
    .dash-sidebar {
      width: 260px;
      background: var(--navy-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,.08);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }
    .dash-main {
      flex: 1;
      margin-left: 260px;
      padding: 32px 40px;
      min-height: 100vh;
    }
    .sidebar-brand {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-menu {
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: .2s ease;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(255,122,69,.15);
      color: #fff;
    }
    .sidebar-link.active {
      color: var(--primary-2);
      font-weight: 800;
    }
    .form-card {
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-soft);
      max-width: 680px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text);
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      transition: .2s ease;
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="dash-sidebar">
    <div class="sidebar-brand">
      <div id="companyAvatar" style="width: 38px; height: 38px; border-radius: 10px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px;">
        CP
      </div>
      <div>
        <strong id="sidebarCompName" style="font-size: 14px; display: block; color: #fff;">Acme Corp</strong>
        <small id="sidebarTierBadge" style="color: var(--teal); font-size: 11px; font-weight: 800;">Growth Tier</small>
      </div>
    </div>

    <nav class="sidebar-menu">
      <a href="dashboard.html" class="sidebar-link">
        <svg style="width:16px;height:16px;fill:currentColor;"><use href="#i-home"/></svg>
        Overview & Positions
      </a>
      <a href="create-interview.html" class="sidebar-link">
        <svg style="width:16px;height:16px;fill:currentColor;"><use href="#i-plus"/></svg>
        Create Interview
      </a>
      <a href="billing.html" class="sidebar-link">
        <svg style="width:16px;height:16px;fill:currentColor;"><use href="#i-spark"/></svg>
        Plans & Quota
      </a>
      <a href="team.html" class="sidebar-link">
        <svg style="width:16px;height:16px;fill:currentColor;"><use href="#i-users"/></svg>
        Team Members
      </a>
      <a href="settings.html" class="sidebar-link active">
        <svg style="width:16px;height:16px;fill:currentColor;"><use href="#i-palette"/></svg>
        Branding & Logo
      </a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="dash-main">
    <div style="margin-bottom: 28px;">
      <h1 style="font-size: 26px; margin-bottom: 4px;">Company Profile & Branding</h1>
      <p style="color: var(--muted); font-size: 14px; margin: 0;">Customize your organization logo, candidate invitation emails, and theme accents</p>
    </div>

    <form class="form-card" onsubmit="handleSettingsSave(event)">
      <div class="form-group">
        <label>Company Legal Name</label>
        <input type="text" id="compNameInput" class="form-control" value="Acme Technologies" required />
      </div>

      <div class="form-group">
        <label>Website URL</label>
        <input type="url" id="compWebInput" class="form-control" value="https://acme.tech" />
      </div>

      <div class="form-group">
        <label>Candidate App Brand Color (Hex)</label>
        <div style="display: flex; gap: 12px; align-items: center;">
          <input type="color" id="compColorInput" value="#FF7A45" style="width: 50px; height: 44px; padding: 2px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer;" />
          <input type="text" id="compColorText" class="form-control" value="#FF7A45" style="max-width: 140px;" />
        </div>
      </div>

      <div style="margin-top: 30px;">
        <button type="submit" class="btn btn-primary btn-lg">
          Save Organization Settings &rarr;
        </button>
      </div>
    </form>
  </main>

  <script src="js/company-api.js"></script>
  <script>
    const session = CompanyApi.requireAuth();
    if (session) {
      document.getElementById("sidebarCompName").innerText = session.company?.name || "My Company";
      document.getElementById("sidebarTierBadge").innerText = `${session.company?.subscriptionTier || "Starter"} Tier`;
      document.getElementById("companyAvatar").innerText = (session.company?.name || "CP").substring(0, 2).toUpperCase();
      document.getElementById("compNameInput").value = session.company?.name || "Acme Technologies";
    }

    function handleSettingsSave(e) {
      e.preventDefault();
      const newName = document.getElementById("compNameInput").value;
      if (session && session.company) {
        session.company.name = newName;
        CompanyApi.setSession(session);
        alert("Company profile updated successfully!");
        window.location.reload();
      }
    }
  </script>
</body>
</html>
