<!doctype html>
<html lang="en" data-theme="cloud">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company Sign In — Career Pilot Enterprise</title>
  <link rel="icon" type="image/png" href="assets/career-pilot-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 40px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text);
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      transition: .2s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,122,69,.15);
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="site-header" style="background: transparent; border-bottom: 1px solid var(--line);">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img src="assets/career-pilot-icon.png" alt="Career Pilot application icon" />
        <span><strong>Career Pilot</strong><small>Enterprise Portal</small></span>
      </a>
    </div>
  </header>

  <!-- AUTH MAIN -->
  <main class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <h2 style="font-size: 24px; margin-bottom: 6px;">Sign In to Enterprise</h2>
        <p style="font-size: 13px; color: var(--muted); margin: 0;">Access your active candidate evaluation pipelines</p>
      </div>

      <div id="errorBox" style="display: none; background: rgba(239,68,68,.1); border: 1px solid #ef4444; color: #dc2626; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 20px;"></div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label>Work Email</label>
          <input type="email" id="email" class="form-control" placeholder="recruiter@company.com" required />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0;">Password</label>
            <a href="javascript:void(0)" onclick="alert('Password reset link sent to work email')" style="font-size: 11px; color: var(--primary); font-weight: 700;">Forgot?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary full btn-lg" style="margin-top: 10px;">
          Sign In to Dashboard &rarr;
        </button>

        <button type="button" class="btn btn-secondary full btn-lg" style="margin-top: 12px;" onclick="handleDemoLogin()">
          ⚡ Instant Demo Recruiter Login
        </button>
      </form>

      <div style="text-align: center; font-size: 13px; color: var(--muted); margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px;">
        New company? <a href="register.html" style="color: var(--primary); font-weight: 800;">Register 14-day free trial</a>
      </div>
    </div>
  </main>

  <script src="js/company-api.js"></script>
  <script>
    // If already logged in, transfer to dashboard
    if (CompanyApi.getSession()) {
      window.location.href = "dashboard.html";
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const btn = document.getElementById("submitBtn");
      const err = document.getElementById("errorBox");

      btn.disabled = true;
      btn.innerText = "Signing in...";
      err.style.display = "none";

      try {
        await CompanyApi.login(email, pass);
        window.location.href = "dashboard.html";
      } catch (ex) {
        err.innerText = "Invalid credentials. Please try again.";
        err.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Sign In to Dashboard →";
      }
    }

    function handleDemoLogin() {
      CompanyApi.login("alex@acme.com", "password123");
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
